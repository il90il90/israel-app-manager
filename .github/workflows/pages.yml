name: Dashboard

# Deploys the catalog admin dashboard (dashboard/) to GitHub Pages:
#   https://il90il90.github.io/israel-app-manager/
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The dashboard is static files only: no backend, no secrets, no build step.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests
        run: node --test tests/dashboard/*.test.mjs
      - name: No secrets in the site
        run: |
          if grep -rEn 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' dashboard/; then
            echo "::error::Something that looks like a GitHub token is in dashboard/. Remove it."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard }
      - id: deployment
        uses: actions/deploy-pages@v4
