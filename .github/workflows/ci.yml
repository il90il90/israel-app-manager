name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "catalog/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and a debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Catalog tools compile
        run: python3 -m py_compile tools/catalog/build_catalog.py tools/catalog/apk_icon.py
      - uses: actions/upload-artifact@v4
        with:
          name: israel-app-manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
